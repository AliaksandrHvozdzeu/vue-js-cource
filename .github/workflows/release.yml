name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - main
      - master

jobs:
  release:
    name: Publish Release
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read version
        id: version
        run: |
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r .name package.json)" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release ${TAG} will be created."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download CI artifact
        if: steps.check.outputs.should_release == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Archive production build
        if: steps.check.outputs.should_release == 'true'
        run: |
          cd dist
          zip -r "../${{ steps.version.outputs.name }}-${{ steps.version.outputs.version }}.zip" .

      - name: Create GitHub Release
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          ARCHIVE="${{ steps.version.outputs.name }}-${{ steps.version.outputs.version }}.zip"

          gh release create "$TAG" "$ARCHIVE" \
            --title "$TAG" \
            --generate-notes
